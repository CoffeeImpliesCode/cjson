# Verification for the Zig package in this repository.
#
# cJSON 1.7.19 ships one CI file of its own, `src/appveyor.yml`, for Windows.
# Everything here is therefore the fork's, and it gates the artifacts this fork
# delivers rather than retargeting anything upstream owns. Nothing in it calls
# AppVeyor, and nothing in it runs CMake or make: the library is built by
# `zig build`, from the vendored source, with the flags this repository owns.
#
# Five jobs, five different questions:
#   native   does the whole package compile, do the tests and the example run in
#            both linkages, and does the *installed* tree serve a plain C
#            consumer and pkg-config
#   cross    does the package compile for each of the six required targets
#   cross-shared
#            the same six through -Dlinkage=dynamic, including the refusal for
#            the one that cannot carry a shared object, shown to precede any
#            delivery decision
#   consumer does the published module resolve from a package that did not
#            write it, in both linkages
#   loaded   does the runtime route resolve the same symbols through a provider
#            this tree installed, and do the same answers follow
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. If a target ever does turn out to be unsupported here, the honest
# edit is to replace that step with a command that asserts the specific
# documented failure and to record the run in FORK-NOTES.md, not to add a flag
# that hides it.
#
# System-library mode (`-fsys=cjson`) is deliberately not a step here: this
# package has no system mode at all. See UPSTREAM.md, "System-library mode".
#
# The full 53-platform matrix is not in this file. `cross-test`, run from the
# package root, builds and *runs* `tests.zig` for every platform in Zig 0.16.0's
# published Tier 1/2 table through this repository's own build graph, using
# `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` and its sibling helpers are a host-local tool with its own runner
# detection and its own scratch policy, not something a GitHub runner has;
# adding a job that invoked a path it does not have would fail for a reason that
# has nothing to do with this package, and wrapping that job in an availability
# check would turn a missing gate into a green one. So this file does not
# pretend to cover it and does not stand in for it: the `cross` jobs below run
# nothing, and a platform with no runner on the host is recorded as explicit
# `build_only` coverage, never as a pass.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests, example and installed closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # The bytes, the exact file set, the preserved upstream README, cJSON's own
      # notice, the vendored Unity and JSON Patch notices, the compiled source
      # list and the version triple. The notice checks are the only way a
      # dropped attribution would be caught before it ships, and the tree is not
      # uniformly MIT -- NOTICE.md is the per-file inventory.
      - name: immutable source and licence notices
        run: |
          set -euo pipefail
          sha256sum -c UPSTREAM.sha256
          tools/check-provenance.sh

      - name: build, test and example, static
        run: |
          set -euo pipefail
          zig build -Doptimize=Debug --summary all
          zig build test -Doptimize=Debug --summary all
          zig build test -Doptimize=ReleaseSafe --summary all
          zig build smoke --summary all

      - name: build, test and example, shared
        run: |
          set -euo pipefail
          zig build -Dlinkage=dynamic -Doptimize=Debug --summary all
          zig build test -Dlinkage=dynamic -Doptimize=Debug --summary all
          zig build smoke -Dlinkage=dynamic --summary all

      # Written once, used against both linkages. The reference for each number
      # is computed in this file's own C arithmetic, not read back out of the
      # build, so a program that only asked cJSON whether it agreed with itself
      # would not pass it.
      - name: write the gate program
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/c_surface_gate.c" <<'C'
          /* A plain C consumer: the installed header, the installed archive or
             shared object, and answers that come from RFC 8259 and from this
             program's own arithmetic. */

          #include <cjson/cJSON.h>
          #include <stdint.h>

          #include <math.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          static int failures = 0;

          static void check(int ok, const char *what) {
            if (!ok) {
              fprintf(stderr, "gate: %s\n", what);
              failures++;
            }
          }

          /* RFC 8259 section 13's second example, and the double its digits
             denote. 37.7668 has no exact binary expansion, so this also checks
             that the parser round-trips the nearest double rather than a
             truncated one. */
          static void check_rfc_example(void) {
            const char *text =
              "[{\"precision\":\"zip\",\"Latitude\":37.7668,"
              "\"Longitude\":-122.3959},{\"precision\":\"zip\","
              "\"Latitude\":37.371991,\"Longitude\":-122.026020}]";
            cJSON *root = cJSON_Parse(text);
            check(root != NULL, "the RFC example parses");
            if (root == NULL) return;

            check(cJSON_GetArraySize(root) == 2, "two elements");
            cJSON *first = cJSON_GetArrayItem(root, 0);
            check(first != NULL, "first element");
            if (first != NULL) {
              cJSON *latitude = cJSON_GetObjectItemCaseSensitive(first, "Latitude");
              check(latitude != NULL, "Latitude is present");
              check(cJSON_GetNumberValue(latitude) == 37.7668, "Latitude is 37.7668");
              cJSON *city = cJSON_GetObjectItem(first, "City");
              check(city == NULL, "the first element has no City");
            }

            cJSON *second = cJSON_GetArrayItem(root, 1);
            if (second != NULL) {
              cJSON *longitude = cJSON_GetObjectItemCaseSensitive(second, "Longitude");
              check(longitude != NULL, "Longitude is present");
              check(cJSON_GetNumberValue(longitude) == -122.02602,
                    "the trailing zero of -122.026020 is not a different double");
            }
            cJSON_Delete(root);
          }

          /* Case folding is upstream's and is not the same in both directions:
             `cJSON_GetObjectItem` folds, `...CaseSensitive` does not, and
             `cJSON_HasObjectItem` folds. A header that disagreed with the
             library here would be caught. */
          static void check_case_folding(void) {
            cJSON *object = cJSON_Parse("{\"Key\":1}");
            check(object != NULL, "the object parses");
            check(cJSON_GetObjectItem(object, "KEY") != NULL, "folded lookup finds it");
            check(cJSON_GetObjectItemCaseSensitive(object, "KEY") == NULL,
                  "exact lookup does not");
            check(cJSON_GetObjectItemCaseSensitive(object, "Key") != NULL,
                  "exact lookup finds the real spelling");
            check(cJSON_HasObjectItem(object, "key") == 1, "HasObjectItem folds");
            check(cJSON_HasObjectItem(object, "other") == 0, "HasObjectItem refuses");
            cJSON_Delete(object);
          }

          /* An error path: a failed parse returns NULL and the reported position
             lies inside the buffer that was parsed. `{"a":}` fails at the `}`.
             Upstream's own clamp puts the position at the last byte for this
             document (src/cJSON.c:1201-1208), and a library that reported a
             position in some other buffer would fail this. */
          static void check_error_position(void) {
            const char *bad = "{\"a\":}";
            const char *base = bad;
            cJSON *document = cJSON_Parse(bad);
            check(document == NULL, "an incomplete value does not parse");
            if (document != NULL) { cJSON_Delete(document); return; }
            const char *where = cJSON_GetErrorPtr();
            check(where != NULL, "a failed parse reports a position");
            check(where != NULL && where >= base && where <= base + strlen(bad),
                  "the reported position is inside the buffer");
          }

          /* Comparison uses a tolerance rather than bits: 0.1 + 0.2 is not 0.3 as
             a double, and cJSON_Compare says they are equal anyway
             (src/cJSON.c:584-588). The bit patterns below are checked here so
             the tolerance is not hiding a parser that lost digits. */
          static void check_numeric_tolerance(void) {
            cJSON *left = cJSON_Parse("0.1");
            cJSON *right = cJSON_Parse("0.3");
            check(left != NULL && right != NULL, "both numbers parse");
            if (left == NULL || right == NULL) { cJSON_Delete(left); cJSON_Delete(right); return; }

            uint64_t bits = 0;
            double sum = 0.1 + 0.2;
            memcpy(&bits, &sum, sizeof bits);
            check(bits != 0x3FD3333333333333ULL, "0.1 + 0.2 is not the double 0.3");

            cJSON *summed = cJSON_Parse("[0.1]");
            if (summed != NULL) {
              cJSON *element = cJSON_GetArrayItem(summed, 0);
              cJSON_SetNumberValue(element, sum);
              cJSON *third = cJSON_Parse("0.3");
              check(cJSON_Compare(element, third, 1) == 1,
                    "0.1 + 0.2 compares equal to 0.3 under cJSON_Compare");
              cJSON_Delete(third);
              cJSON_Delete(summed);
            }
            cJSON_Delete(left);
            cJSON_Delete(right);
          }

          /* Ownership: a detached member is the caller's to release, and the
             document no longer holds it. */
          static void check_ownership(void) {
            cJSON *object = cJSON_Parse("{\"a\":1,\"b\":2}");
            check(object != NULL, "the object parses");
            if (object == NULL) return;
            cJSON *taken = cJSON_DetachItemFromObjectCaseSensitive(object, "a");
            check(taken != NULL, "the member is detached");
            check(cJSON_GetArraySize(object) == 1, "the object is one member shorter");
            check(cJSON_GetNumberValue(taken) == 1, "the detached member kept its value");
            cJSON_Delete(taken);
            cJSON_Delete(object);
          }

          /* The depth limit the header states (CJSON_NESTING_LIMIT 1000,
             src/cJSON.h:136-138). Sixteen levels is inside it and must parse. */
          static void check_depth(void) {
            cJSON *nested = cJSON_Parse("[[[[[[[[[[[[[[[[1]]]]]]]]]]]]]]]]]]");
            check(nested != NULL, "sixteen levels parse");
            if (nested == NULL) return;
            char *printed = cJSON_PrintUnformatted(nested);
            check(printed != NULL, "the nested document prints");
            check(printed != NULL && strstr(printed, "1") != NULL,
                  "the leaf survived");
            cJSON_free(printed);
            cJSON_Delete(nested);
          }

          int main(void) {
            check(strcmp(cJSON_Version(), "1.7.19") == 0,
                  "the library reports the version these headers describe");
            check_rfc_example();
            check_case_folding();
            check_error_position();
            check_numeric_tolerance();
            check_ownership();
            check_depth();
            if (failures != 0) {
              fprintf(stderr, "gate: %d check(s) failed\n", failures);
              return 1;
            }
            printf("gate: every C-surface answer checked\n");
            return 0;
          }
          C

      # The same program has to pass linked against the archive and against the
      # shared object, which is only possible in one job -- and sharing it is
      # what makes the comparison meaningful: a difference between the two
      # artifacts cannot hide.
      - name: the installed tree serves a C consumer, static
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cc -std=c99 -Wall -Wextra -o c_gate_static \
            c_surface_gate.c \
            -I "$GITHUB_WORKSPACE/zig-out/include" \
            "$GITHUB_WORKSPACE/zig-out/lib/libcjson.a" -lm
          ./c_gate_static
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/zig-out/lib/pkgconfig" \
            pkg-config --exists cjson
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/zig-out/lib/pkgconfig" \
            pkg-config --modversion cjson

      - name: the installed tree serves a C consumer, shared
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zig build -Dlinkage=dynamic -Doptimize=Debug \
            --prefix "$RUNNER_TEMP/prefix-dynamic" \
            --cache-dir "$RUNNER_TEMP/cache-dynamic" --summary all
          cc -std=c99 -Wall -Wextra -o c_gate_shared \
            "$RUNNER_TEMP/c_surface_gate.c" \
            -I "$RUNNER_TEMP/prefix-dynamic/include" \
            -L "$RUNNER_TEMP/prefix-dynamic/lib" -lcjson -lm
          LD_LIBRARY_PATH="$RUNNER_TEMP/prefix-dynamic/lib" ./c_gate_shared
          PKG_CONFIG_PATH="$RUNNER_TEMP/prefix-dynamic/lib/pkgconfig" \
            pkg-config --exists cjson

  cross:
    name: six-target compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: compile every required target
        run: |
          set -euo pipefail
          zig build check --summary all
          # Named separately as well, so the log says which cell produced which
          # artifact rather than only that six steps ran.
          for triple in x86_64-linux-gnu aarch64-linux-gnu aarch64-macos-none \
                        x86_64-windows-gnu riscv64-linux-gnu wasm32-wasi; do
            echo "== $triple =="
            zig build check -Dtarget="$triple" --summary all
          done

  cross-shared:
    name: six-target compile check against the shared object
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: the five targets that can carry a shared object
        run: |
          set -euo pipefail
          for triple in x86_64-linux-gnu aarch64-linux-gnu aarch64-macos-none \
                        x86_64-windows-gnu riscv64-linux-gnu; do
            echo "== $triple =="
            zig build check -Dlinkage=dynamic -Dtarget="$triple" --summary all
          done
      # wasm32-wasi has no dynamic linker, so a shared object there is a file
      # nothing can load. The refusal is asserted here rather than tolerated:
      # the command has to fail, and its message has to name the target and the
      # reason. A step that *passed* for this cell would mean the refusal was
      # quietly replaced by a downgrade.
      - name: wasm32-wasi refuses a shared object, with the reason
        run: |
          set -euo pipefail
          if zig build check -Dlinkage=dynamic -Dtarget=wasm32-wasi --summary all 2>refusal.txt; then
            echo "wasm32-wasi accepted a shared object; the refusal is gone" >&2
            exit 1
          fi
          grep -q 'wasm32' refusal.txt
          grep -q 'dynamic linker' refusal.txt

  consumer:
    name: the published module from a package that did not write it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: linked consumer, both linkages
        run: |
          set -euo pipefail
          cd consumer
          zig build run --summary all
          zig build run -Dlinkage=dynamic --summary all
      - name: runtime-loaded consumer, with the provider named explicitly
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zig build -Dlinkage=dynamic -Doptimize=Debug \
            --prefix "$RUNNER_TEMP/prefix-dynamic" \
            --cache-dir "$RUNNER_TEMP/cache-dynamic" --summary all
          cd consumer
          zig build run -Druntime=true --summary all -- \
            --provider "$RUNNER_TEMP/prefix-dynamic/lib/libcjson.so"

  loaded:
    name: the runtime route against a provider this tree installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: install a shared object and dispatch to it
        run: |
          set -euo pipefail
          zig build -Dlinkage=dynamic -Doptimize=Debug \
            --prefix "$RUNNER_TEMP/prefix-dynamic" \
            --cache-dir "$RUNNER_TEMP/cache-dynamic" --summary all
          CJSON_PROVIDER="$RUNNER_TEMP/prefix-dynamic/lib/libcjson.so" \
            zig build test -Druntime=true --summary all
          CJSON_PROVIDER="$RUNNER_TEMP/prefix-dynamic/lib/libcjson.so" \
            zig build smoke -Druntime=true --summary all
      # Use a loadable shared object with no cJSON exports. An executable such
      # as /bin/true can fail at dlopen before symbol resolution is exercised.
      # The refusal must identify a missing API symbol, not a generic failure.
      - name: a provider without the API is refused by name
        run: |
          set -euo pipefail
          printf 'int unrelated(void) { return 0; }\n' |
            cc -x c -fPIC -shared -o "$RUNNER_TEMP/not-cjson.so" -
          set +e
          CJSON_PROVIDER="$RUNNER_TEMP/not-cjson.so" zig build test -Druntime=true --summary all 2>refusal.txt
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "a provider without the cJSON API was accepted" >&2
            exit 1
          fi
          cat refusal.txt
          grep -q 'missing required symbol: cJSON_' refusal.txt